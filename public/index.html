<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeeWeb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #282c34;
    }

    #setup-panel {
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 24px;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      gap: 12px;
    }

    #setup-panel.visible {
      display: flex;
    }

    #setup-panel code {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="setup-panel">
    <h1>KeeWeb 资源未就绪</h1>
    <p>请在插件目录执行 <code>npm run setup</code> 下载 KeeWeb 静态资源。</p>
  </div>
  <script src="./app.js"></script>
</body>
</html>
